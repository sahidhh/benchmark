# T2 Benchmark -- Review task type (updated 2026-06-28)
# Status: Gemini hit LENGTH at 1500 tokens (BM-0053, reviewer profile) -- bump to 2500
# DeepSeek-r1 ELIMINATED: reasoning tokens + slow (136s baseline) + LENGTH on profiled runs
# Re-running Gemini reviewer profile with max_tokens=2500 to get a complete response
#
# Run (Gemini re-run with more headroom):
#   python benchmark.py --config config-t2-review.yaml --model google/gemini-2.5-flash --max-tokens 2500
# Full matrix:
#   python benchmark.py --config config-t2-review.yaml

openrouter:
  api_key: "${OPENROUTER_API_KEY}"
  base_url: "https://openrouter.ai/api/v1"

run:
  model:
    - "anthropic/claude-sonnet-4-6"   # T2 incumbent (caught 10/10 issues)
    - "google/gemini-2.5-flash"        # challenger (caught 6-7/10; reviewer profile was incomplete)
  profile:
    - "profiles/reviewer.md"           # task-matched
    - "profiles/baseline.md"           # control
  task:
    - "tasks/review.md"
  fixture: "fixtures/dotnet-review"
  temperature: 0
  max_tokens: 2500                     # bumped from 1500 -- Gemini reviewer profile needs more room
