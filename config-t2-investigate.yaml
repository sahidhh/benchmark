# T2 Benchmark -- Investigation task type (updated 2026-06-28)
# Status: Gemini 2 runs complete (BM-0047, BM-0048), 1 more needed for 3-run threshold
# DeepSeek-r1 ELIMINATED: reasoning tokens cause LENGTH failures at 1500; too slow for interactive use
#
# Run: python benchmark.py --config config-t2-investigate.yaml
# Confirmation run (just Gemini investigation profile x2 more):
#   python benchmark.py --model google/gemini-2.5-flash --task tasks/investigate.md --profile profiles/investigation.md

openrouter:
  api_key: "${OPENROUTER_API_KEY}"
  base_url: "https://openrouter.ai/api/v1"

run:
  model:
    - "anthropic/claude-sonnet-4-6"   # T2 incumbent
    - "google/gemini-2.5-flash"        # T2 candidate (matched Sonnet quality at 4x lower cost)
  profile:
    - "profiles/investigation.md"      # task-matched
    - "profiles/baseline.md"           # control
  task:
    - "tasks/investigate.md"
  fixture: "fixtures/dotnet-investigation"
  temperature: 0
  max_tokens: 1500
